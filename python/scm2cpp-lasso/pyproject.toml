[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scm2cpp-lasso"
version = "0.19.0"
description = "Renamed to scm2cpp-learn: this package installs it and keeps `import scm2cpp_lasso` working"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Hirotaka Niitsuma"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Development Status :: 7 - Inactive",
]
dependencies = ["scm2cpp-learn>=0.19.0"]

[project.urls]
Homepage = "https://github.com/niitsuma/scm2cpp"
Source = "https://github.com/niitsuma/scm2cpp/tree/master/python/scm2cpp-learn"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
