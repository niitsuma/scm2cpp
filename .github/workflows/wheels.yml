# Wheels of scm2cpp-lasso, by cibuildwheel: manylinux x86_64, macOS arm64
# and Windows AMD64 (MSVC; no BLAS there, the loop variants),
# each one py3-none wheel -- the extensions are
# shared libraries loaded through ctypes, not Python modules, so one
# build serves every Python.  OpenBLAS is linked and bundled into the
# wheel (auditwheel / delocate).  No CUDA: a wheel cannot know the
# device; the GPU builds come from the sdist where nvcc is present.
# macOS 14 or later: Homebrew's OpenBLAS, bundled, is built for it.
# Run by hand (Actions -> wheels -> Run workflow, or `gh workflow run
# wheels.yml`); the wheels are the run's artifacts, and are uploaded
# to PyPI from a maintainer's machine.
name: wheels

on:
  workflow_dispatch:

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.23.3
        with:
          package-dir: python/scm2cpp-lasso
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y epel-release &&
            dnf config-manager --set-enabled powertools &&
            dnf install -y openblas-devel pkgconf-pkg-config
          CIBW_BEFORE_ALL_MACOS: brew install openblas pkg-config
          CIBW_ENVIRONMENT_MACOS: >
            PKG_CONFIG_PATH="$(brew --prefix openblas)/lib/pkgconfig"
            MACOSX_DEPLOYMENT_TARGET=14.0
          CIBW_TEST_REQUIRES: numpy scikit-learn
          CIBW_TEST_COMMAND: python {project}/python/scm2cpp-lasso/check-wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
